# ══════════════════════════════════════════════════════════════════════════════
# docker-compose.gpu.yml — GPU Services
#
# Requires: NVIDIA GPU + nvidia-container-toolkit installed on the host.
# Install guide: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# These services are NOT started automatically. Use -f to merge with core:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Or bring up GPU services only:
#
#   docker compose -f docker-compose.gpu.yml up -d
#
# Related compose files:
#   docker-compose.yml       — Core services: server, deerflow, vibe, tailscale
#   docker-compose.infra.yml — Infrastructure: gitea, minio, penpot, searxng, playwright
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── vLLM (local OpenAI-compatible inference server) ────────────────────────
  #
  # Canonical Vibe Stack inference backend. Defaults are tuned for the
  # Qwen3.5-9B-AWQ model on a 24 GB GPU. Override any flag via env vars in
  # .env (see .env.example for the full list and tuning notes).
  #
  # Hardware sizing (default model = Qwen3.5-9B-AWQ, ~5 GB weights):
  #   24 GB GPU  →  works as-is (default)
  #   16 GB GPU  →  set VLLM_MAX_MODEL_LEN=16384 VLLM_MAX_NUM_SEQS=4
  #   12 GB GPU  →  use a smaller model: VLLM_MODEL=Qwen/Qwen3.5-4B-Instruct
  #
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    command:
      - ${VLLM_MODEL:-QuantTrio/Qwen3.5-9B-AWQ}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-32768}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEM_UTIL:-0.92}"
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-8}"
      - --trust-remote-code
      - --enable-auto-tool-choice
      # IMPORTANT: tool-call parser must match the model family.
      # Qwen3.5 emits XML-tagged tool calls and requires qwen3_xml. Using
      # the wrong parser (e.g. hermes) causes vLLM to silently swallow tool
      # calls and stream empty content, which DeerFlow surfaces as repeated
      # "non-substantive response detected" retry warnings. If you change
      # VLLM_MODEL to a non-Qwen model, also override VLLM_TOOL_CALL_PARSER.
      - --tool-call-parser
      - "${VLLM_TOOL_CALL_PARSER:-qwen3_xml}"
      # Explicit AWQ quantization (matches the default AWQ weights).
      # If you point VLLM_MODEL at unquantized weights, set VLLM_QUANTIZATION
      # to an empty string to omit this flag (or override to gptq/fp8/etc).
      - --quantization
      - "${VLLM_QUANTIZATION:-awq}"
      # NOTE: --reasoning-parser intentionally NOT set. Enabling it (e.g.
      # --reasoning-parser qwen3) makes vLLM split output into content (null)
      # + reasoning (the actual text), and DeerFlow/LangChain only read
      # content — agents see empty responses.
    volumes:
      - vllm-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 9B AWQ model loads in ~15-30s on a warm cache, longer on first
      # boot when weights need to download (~5 GB).
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${VIBE_VLLM_MEMORY_LIMIT:-24G}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── OpenSandbox (secure code execution sandbox) ────────────────────────────
  opensandbox:
    image: opensandbox/server:v0.1.7
    restart: unless-stopped
    command: ["--config", "/root/.sandbox.toml"]
    ports:
      - "9090:8080"
    volumes:
      - ./sandbox/sandbox.toml:/root/.sandbox.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/home/user/Vibe:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${VIBE_SANDBOX_MEMORY_LIMIT:-4G}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── ComfyUI (image generation UI) ──────────────────────────────────────────
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest
    restart: unless-stopped
    profiles:
      - gpu-comfyui
    ports:
      - "8188:8188"
    environment:
      - COMFYUI_PORT=8188
    volumes:
      - comfyui-data:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  vllm-models:
  comfyui-data:
