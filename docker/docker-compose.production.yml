# Production overlay for docker-compose.paperclip.yml
#
# Usage:
#   docker compose -f docker/docker-compose.paperclip.yml \
#                  -f docker/docker-compose.production.yml up -d
#
# Changes from development:
#   - Pulls pre-built images from GHCR instead of building locally
#   - Adds resource limits and restart policies
#   - Configures JSON log driver for log aggregation
#   - Adds health checks to agent containers
#   - Pins image tags (override VIBE_IMAGE_TAG in .env)

x-vibe-production: &vibe-production
  image: ghcr.io/tmartin2113/vibe:${VIBE_IMAGE_TAG:-latest}
  build: !reset null
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
      reservations:
        cpus: "0.5"
        memory: 512M
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  healthcheck:
    test: ["CMD", "python", "-c", "import agents; print('ok')"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s

services:
  paperclip:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  opensandbox:
    image: opensandbox/server:v0.1.7
    volumes:
      - ../sandbox/sandbox.production.toml:/root/.sandbox.toml:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  vllm:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  vibe-code:
    <<: *vibe-production

  vibe-test:
    <<: *vibe-production

  vibe-security:
    <<: *vibe-production

  vibe-research:
    <<: *vibe-production

  vibe-orchestrator:
    <<: *vibe-production
