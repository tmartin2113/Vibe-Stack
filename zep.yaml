# Zep CE configuration. Schema reverse-engineered from the default
# /app/zep.yaml in zepai/zep:latest. Do NOT use the legacy `server:` /
# `store.postgres.dsn:` keys — they were renamed in newer images:
#   server: → http:
#   store.postgres.dsn → flat postgres.{user,password,host,port,database}
#   ZEP_GRAPHITI_URL env → graphiti.service_url here

log:
  level: info
  format: json

http:
  host: 0.0.0.0
  port: 8000
  max_request_size: 5242880

postgres:
  user: postgres
  password: postgres
  host: zep-db
  port: 5432
  database: zep
  schema_name: public
  read_timeout: 30
  write_timeout: 30
  max_open_connections: 10

carbon:
  locale: en

graphiti:
  service_url: http://graphiti:8003

# Required by the binary even though Zep also reads it from env. Local-dev
# placeholder — override with a real secret in production deployments.
api_secret: local-dev-only-change-in-production

telemetry:
  disabled: true
