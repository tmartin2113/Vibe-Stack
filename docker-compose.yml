services:
  vibe:
    build: .
    env_file: .env
    restart: unless-stopped
    group_add:
      - "125"   # host docker group GID — lets 'vibe' user run 'docker info'
    depends_on:
      opensandbox:
        condition: service_healthy
    environment:
      - VIBE_BACKEND_HOST=vllm
      - VIBE_BACKEND_PORT=8000
      - VIBE_SANDBOX_URL=http://opensandbox:8080
      - VIBE_HEALTH_PORT=8080
      - BULLETIN_PATH=/shared/bulletin/BULLETIN.md
      - MESSAGE_STORE_PATH=/shared/bulletin/messages.db
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - vibe-data:/home/vibe/.vibe
      - bulletin-data:/shared/bulletin
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/home/user/Vibe:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm:
    image: vllm/vllm-openai:latest
    profiles:
      - vllm   # use 'docker compose --profile vllm up' when no host vLLM service
    ports:
      - "8000:8000"
    command:
      - "${VLLM_MODEL:-Qwen/Qwen3.5-9B}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--max-num-seqs"
      - "4"
      - "--trust-remote-code"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
      - "--reasoning-parser"
      - "qwen3"
      - "--enforce-eager"
    volumes:
      - vllm-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  opensandbox:
    image: opensandbox/server:v0.1.7
    command: ["--config", "/root/.sandbox.toml"]
    ports:
      - "9090:8080"
    volumes:
      - ./sandbox/sandbox.toml:/root/.sandbox.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/home/user/Vibe:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-vibe}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve-config.json:/config/serve-config.json:ro

volumes:
  vllm-models:
  vibe-data:
  bulletin-data:
  tailscale-state:
