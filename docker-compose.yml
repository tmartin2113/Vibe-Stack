services:
  vibe:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - VIBE_BACKEND_HOST=vllm
      - VIBE_BACKEND_PORT=8000
      - VIBE_SANDBOX_URL=http://opensandbox:8080
      - VIBE_HEALTH_PORT=8080
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - vibe-data:/home/vibe/.vibe
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/home/user/Vibe:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - vllm-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  opensandbox:
    image: opensandbox/server:v0.1.7
    command: ["--config", "/root/.sandbox.toml"]
    ports:
      - "9090:8080"
    volumes:
      - ./sandbox/sandbox.toml:/root/.sandbox.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/home/user/Vibe:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  vllm-models:
  vibe-data:
