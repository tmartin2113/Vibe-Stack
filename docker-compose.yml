# ══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — Core Services (always-on)
#
# This file defines the 5 services that run in every deployment:
#   server, deerflow-langgraph, deerflow-gateway, vibe, tailscale
#
# Related compose files (not auto-merged — use -f or profiles explicitly):
#   docker-compose.gpu.yml   — GPU services: opensandbox, comfyui
#   docker-compose.infra.yml — Infrastructure: gitea, minio, penpot, searxng, playwright
#   docker-compose.override.yml — Local dev overrides (gitignored; see .example)
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Paperclip Server ───────────────────────────────────────────────────────
  server:
    image: ghcr.io/tmartin2113/paperclip-server:${PAPERCLIP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3100:3100"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Force embedded postgres (no external DATABASE_URL)
      - DATABASE_URL=
      # Container-side path for agent instruction files (bootstrap uses this)
      - PAPERCLIP_PROJECTS_DIR=/paperclip/Projects
      # Heartbeat scheduler disabled — agents are woken by events, not timers.
      # To re-enable, set ENABLED=true and uncomment the interval.
      - HEARTBEAT_SCHEDULER_ENABLED=false
      # - HEARTBEAT_SCHEDULER_INTERVAL_MS=60000
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3100,https://${TAILSCALE_HOSTNAME:-localhost}}
      - PAPERCLIP_ALLOWED_HOSTNAMES=${TAILSCALE_HOSTNAME:-localhost},localhost,server
      - SEARXNG_URL=${SEARXNG_URL:-http://host.docker.internal:8888}
      - GITEA_URL=${GITEA_URL:-http://host.docker.internal:3000}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - PLAYWRIGHT_WS_URL=${PLAYWRIGHT_WS_URL:-ws://host.docker.internal:3003}
      - MINIO_URL=${MINIO_URL:-http://host.docker.internal:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-vibe}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      - PAPERCLIP_HEALTH_URL=http://vibe:8080
    volumes:
      - paperclip-data:/paperclip
      # Mount host Projects at both /paperclip/Projects (new canonical) and
      # the host HOME path (legacy — bootstrap may have stored either in DB)
      - ${PAPERCLIP_PROJECTS_DIR:-${HOME}/Projects}:/paperclip/Projects
      - ${PAPERCLIP_PROJECTS_DIR:-${HOME}/Projects}:${HOME}/Projects
      - ${HOME}/Repos:${HOME}/Repos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── DeerFlow LangGraph Backend ─────────────────────────────────────────────
  deerflow-langgraph:
    image: ghcr.io/tmartin2113/paperclip-deerflow:${PAPERCLIP_VERSION:-latest}
    restart: always
    command: >
      sh -c "cd backend &&
      uv run langgraph dev
      --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2024/ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./deerflow/config.yaml:/app/backend/config.yaml:ro
      - ./deerflow/extensions_config.json:/app/extensions_config.json:ro
      - palace-data:/palace
      - graphify-data:/graphify
      # Mount the user's project directory read-only at two paths:
      #   /workspace          — canonical container path (use in agent prompts)
      #   ${HOME}/Projects    — host-HOME path (so absolute paths like
      #                         /home/alice/Projects/... from an issue
      #                         description resolve inside the container)
      # The same pattern is used by the `server` service above.
      - ${PAPERCLIP_PROJECTS_DIR:-${HOME}/Projects}:/workspace:ro
      - ${PAPERCLIP_PROJECTS_DIR:-${HOME}/Projects}:${HOME}/Projects:ro
      # Mirror the server's /paperclip/Projects path so DeerFlow pre-flight
      # research can resolve the same cwd the server passes in context.
      - ${PAPERCLIP_PROJECTS_DIR:-${HOME}/Projects}:/paperclip/Projects:ro
      - ${HOME}/Repos:${HOME}/Repos:ro
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - GITEA_URL=${GITEA_URL:-http://gitea:3000}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - PLAYWRIGHT_WS_URL=${PLAYWRIGHT_WS_URL:-ws://playwright:3003}
      - MINIO_URL=${MINIO_URL:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-vibe}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      - MEMPALACE_PALACE_PATH=/palace/palace
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - PAPERCLIP_INTERNAL_URL=http://server:3100
      - GRAPHIFY_DATA_PATH=/graphify
      # LangSmith tracing (optional — set LANGSMITH_API_KEY in .env to enable)
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-vibe-stack}

  # ── DeerFlow Gateway ───────────────────────────────────────────────────────
  deerflow-gateway:
    image: ghcr.io/tmartin2113/paperclip-deerflow:${PAPERCLIP_VERSION:-latest}
    restart: always
    command: >
      sh -c "cd backend &&
      uv run uvicorn
      src.gateway.app:app --host 0.0.0.0 --port 8001"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./deerflow/config.yaml:/app/backend/config.yaml:ro
      - ./deerflow/extensions_config.json:/app/extensions_config.json:ro
      - palace-data:/palace
      - graphify-data:/graphify
      # Same workspace mounts as deerflow-langgraph — some gateway tools
      # (e.g. file previews) may resolve paths directly.
      - ${PAPERCLIP_PROJECTS_DIR:-${HOME}/Projects}:/workspace:ro
      - ${PAPERCLIP_PROJECTS_DIR:-${HOME}/Projects}:${HOME}/Projects:ro
      - ${PAPERCLIP_PROJECTS_DIR:-${HOME}/Projects}:/paperclip/Projects:ro
      - ${HOME}/Repos:${HOME}/Repos:ro
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - GITEA_URL=${GITEA_URL:-http://gitea:3000}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - PLAYWRIGHT_WS_URL=${PLAYWRIGHT_WS_URL:-ws://playwright:3003}
      - MINIO_URL=${MINIO_URL:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-vibe}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      - MEMPALACE_PALACE_PATH=/palace/palace
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - PAPERCLIP_INTERNAL_URL=http://server:3100
      - GRAPHIFY_DATA_PATH=/graphify
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-vibe-stack}

  # ── Vibe Agent (local build) ───────────────────────────────────────────────
  vibe:
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "125"   # host docker group GID — lets 'vibe' user run 'docker info'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - VIBE_BACKEND_HOST=${VIBE_BACKEND_HOST:-host.docker.internal}
      - VIBE_BACKEND_PORT=${VIBE_BACKEND_PORT:-11434}
      - VIBE_SANDBOX_URL=${VIBE_SANDBOX_URL:-http://opensandbox:8080}
      - VIBE_HEALTH_PORT=8080
      - BULLETIN_PATH=/shared/bulletin/BULLETIN.md
      - MESSAGE_STORE_PATH=/shared/bulletin/messages.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - PLAYWRIGHT_WS_URL=${PLAYWRIGHT_WS_URL:-ws://playwright:3003}
      - PENPOT_API_URL=${PENPOT_API_URL:-http://penpot-backend:6060}
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - GITEA_URL=${GITEA_URL:-http://gitea:3000}
      - MINIO_URL=${MINIO_URL:-http://minio:9000}
      - MEMPALACE_PALACE_PATH=/home/vibe/.mempalace/palace
      - GRAPHIFY_DATA_PATH=/graphify
      - VIBE_MAX_CONCURRENT_AGENTS=${VIBE_MAX_CONCURRENT_AGENTS:-0}
      - VIBE_SCHEDULER_INTERVAL=${VIBE_SCHEDULER_INTERVAL:-30}
      - VIBE_AGENT_TIMEOUT=${VIBE_AGENT_TIMEOUT:-600}
      - VIBE_DISABLED_AGENTS=${VIBE_DISABLED_AGENTS:-}
      - VIBE_MEMORY_PRESSURE_THRESHOLD=${VIBE_MEMORY_PRESSURE_THRESHOLD:-90}
      - VIBE_INFRA_RESERVE_GB=${VIBE_INFRA_RESERVE_GB:-10}
    volumes:
      - vibe-data:/home/vibe/.vibe
      - bulletin-data:/shared/bulletin
      - palace-data:/home/vibe/.mempalace
      - graphify-data:/graphify
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "${VIBE_ORCHESTRATOR_CPUS:-4.0}"
          memory: ${VIBE_ORCHESTRATOR_MEMORY_LIMIT:-4G}
        reservations:
          memory: 512M

  # ── Tailscale ──────────────────────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-vibe}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=${TS_USERSPACE:-true}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve-config.json:/config/serve-config.json:ro

volumes:
  paperclip-data:
  vibe-data:
  bulletin-data:
  palace-data:
  graphify-data:
  tailscale-state:

networks:
  default:
    driver: bridge
