# /etc/fail2ban/filter.d/caddy-paperclip.conf
# Detects brute force attempts against Paperclip auth endpoints

[Definition]
# Match failed login attempts in Caddy JSON access log
# Triggers on repeated 401/403 responses to auth endpoints
failregex = .*"uri":"\/api\/auth\/sign-in".*"status":4\d\d.*"remote_ip":"<HOST>".*
            .*"uri":"\/api\/auth\/".*"status":401.*"remote_ip":"<HOST>".*

ignoreregex =
