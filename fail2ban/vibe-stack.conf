# /etc/fail2ban/jail.d/vibe-stack.conf
# fail2ban configuration for Vibe Stack 2.0

[DEFAULT]
bantime  = 86400
findtime = 600
maxretry = 3
destemail = root@localhost
sendername = fail2ban-vibe
action = %(action_mwl)s

[sshd]
enabled  = true
port     = ssh
filter   = sshd
logpath  = /var/log/auth.log
maxretry = 3
bantime  = 86400

# Aggressive jail: immediately ban IPs that try password auth
[sshd-aggressive]
enabled  = true
port     = ssh
filter   = sshd[mode=aggressive]
logpath  = /var/log/auth.log
maxretry = 1
bantime  = 604800

# Protect Caddy / Paperclip from brute force on auth endpoints
[caddy-paperclip]
enabled  = true
port     = 80,443
filter   = caddy-paperclip
logpath  = /var/log/caddy/access.log
maxretry = 10
findtime = 300
bantime  = 3600
