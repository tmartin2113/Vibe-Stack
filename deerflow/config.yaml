# DeerFlow Configuration — Vibe Stack
#
# Mounted into the DeerFlow container at /app/backend/config.yaml.
# Uses $VAR syntax for env var resolution (DeerFlow's config parser
# does NOT support ${VAR:-default} bash syntax).
#
# Module paths use the "deerflow.*" namespace, which matches the source
# layout shipped inside the current paperclip-deerflow image. Verify with:
#   docker compose exec deerflow-langgraph bash -c \
#     'cd /app/backend && uv run python -c "from deerflow.community.searxng.tools import web_search_tool"'
#
# Required env vars (set in .env by setup.sh):
#   VLLM_MODEL     — model name served by vLLM
#   VLLM_API_URL   — vLLM OpenAI-compatible API URL

# ── Models ──────────────────────────────────────────────────────
models:
  - name: "local-vllm"
    display_name: "Local vLLM"
    description: "Local model via vLLM"
    # VllmChatModel preserves reasoning across multi-turn tool-call flows.
    # Falls back to ChatOpenAI if the provider isn't available in the image.
    use: "deerflow.models.vllm_provider:VllmChatModel"
    model: "$VLLM_MODEL"
    base_url: "$VLLM_API_URL"
    api_key: "no-key-needed"
    temperature: 0.3
    supports_thinking: true
    # CRITICAL: suppress Qwen3.5's reasoning/thinking tokens at the chat
    # template layer. Without this, vLLM streams `<think>...</think>` blocks
    # as the response content. DeerFlow's adapter strips that boilerplate
    # and is then left with "0 chars after stripping boilerplate", flagging
    # every response as non-substantive and retrying until the budget is
    # exhausted. (Same symptom class as the prior --reasoning-parser bug,
    # different root cause.)
    #
    # Passthrough chain:
    #   model_kwargs.extra_body.chat_template_kwargs.enable_thinking: false
    #   → ChatOpenAI(model_kwargs={"extra_body": {...}})
    #   → OpenAI client sends `chat_template_kwargs` in the request body
    #   → vLLM applies Qwen3.5's chat template with enable_thinking=false
    #   → model skips the reasoning section entirely
    #
    # If VLLM_MODEL is swapped to a non-Qwen model, this block is harmless
    # — vLLM ignores chat_template_kwargs that the template doesn't use.
    model_kwargs:
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

# ── Sandbox ─────────────────────────────────────────────────────
# Local sandbox — DeerFlow assistants explore the workspace directly.
# No Docker-in-Docker needed; the container already has filesystem access.
sandbox:
  use: "deerflow.sandbox.local.local_sandbox_provider:LocalSandboxProvider"
  # Bash is gated because LocalSandboxProvider is not an isolation boundary.
  # Explicitly enabled here since the container IS the sandbox.
  allow_host_bash: true
  # Output truncation limits (characters) — prevent context window overflow.
  # bash uses middle-truncation (head + tail); read_file and ls use head-truncation.
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# ── Tools ───────────────────────────────────────────────────────
# Tool groups use upstream's finer-grained access control model:
#   web       — search + fetch (read-only external)
#   file:read — ls, read_file, glob, grep (read-only workspace)
#   file:write— write_file, str_replace (workspace mutations)
#   bash      — shell execution (gated by sandbox.allow_host_bash)
tool_groups:
  - name: "web"
  - name: "file:read"
  - name: "file:write"
  - name: "bash"

tools:
  # ── Web tools ───────────────────────────────────────────────
  - name: "web_search"
    group: "web"
    use: "deerflow.community.searxng.tools:web_search_tool"
  - name: "crawl"
    group: "web"
    use: "deerflow.community.jina_ai.tools:web_fetch_tool"
  # ── File read tools ─────────────────────────────────────────
  - name: "ls"
    group: "file:read"
    use: "deerflow.sandbox.tools:ls_tool"
  - name: "read_file"
    group: "file:read"
    use: "deerflow.sandbox.tools:read_file_tool"
  - name: "glob"
    group: "file:read"
    use: "deerflow.sandbox.tools:glob_tool"
    max_results: 200
  - name: "grep"
    group: "file:read"
    use: "deerflow.sandbox.tools:grep_tool"
    max_results: 100
  # ── File write tools ────────────────────────────────────────
  - name: "write_file"
    group: "file:write"
    use: "deerflow.sandbox.tools:write_file_tool"
  - name: "str_replace"
    group: "file:write"
    use: "deerflow.sandbox.tools:str_replace_tool"
  # ── Shell execution ─────────────────────────────────────────
  - name: "bash"
    group: "bash"
    use: "deerflow.sandbox.tools:bash_tool"

# ── Title Generation ──────────────────────────────────────────
# Auto-generate conversation titles after first exchange.
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null  # use default model

# ── Summarization ─────────────────────────────────────────────
# Auto-summarize conversation history when approaching token limits.
# Critical for long-running DeerFlow sessions on vLLM's context window.
summarization:
  enabled: true
  model_name: null  # use default model
  trigger:
    - type: tokens
      value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  # Structured summary template (ported from NousResearch/hermes-agent).
  # Produces a handoff document that preserves goal, progress, decisions,
  # files touched, and next steps — instead of the default generic extraction.
  summary_prompt: |
    Create a structured handoff summary for a later assistant that will continue
    this conversation after earlier turns are compacted.

    TURNS TO SUMMARIZE:
    {messages}

    Use this exact structure:

    ## Goal
    [What the user is trying to accomplish]

    ## Constraints & Preferences
    [User preferences, coding style, constraints, important decisions]

    ## Progress
    ### Done
    [Completed work — include specific file paths, commands run, results obtained]
    ### In Progress
    [Work currently underway]
    ### Blocked
    [Any blockers or issues encountered]

    ## Key Decisions
    [Important technical decisions and why they were made]

    ## Relevant Files
    [Files read, modified, or created — with brief note on each]

    ## Next Steps
    [What needs to happen next to continue the work]

    ## Critical Context
    [Any specific values, error messages, configuration details, or data that
    would be lost without explicit preservation]

    Be specific — include file paths, command outputs, error messages, and
    concrete values rather than vague descriptions. The goal is to prevent the
    next assistant from repeating work or losing important details.

    Write only the summary body. Do not include any preamble or prefix.

# ── Memory ────────────────────────────────────────────────────
# Persistent memory — stores user context and conversation history
# for personalized responses across sessions.
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30

# ── Checkpointer ────────────────────────────────────────────────
checkpointer:
  type: "sqlite"
  connection_string: "/tmp/deerflow-checkpoints.db"
