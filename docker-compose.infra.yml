# ══════════════════════════════════════════════════════════════════════════════
# docker-compose.infra.yml — Infrastructure Layer
#
# This file defines supporting infrastructure services: search, browser
# automation, source control, object storage, design tooling, and local
# build helpers.
#
# These services are NOT started automatically. Use -f to merge with core:
#
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml up -d
#
# Or bring up infra only:
#
#   docker compose -f docker-compose.infra.yml up -d
#
# Related compose files:
#   docker-compose.yml       — Core services: server, deerflow, vibe, tailscale
#   docker-compose.gpu.yml   — GPU services: vllm, opensandbox, comfyui
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── SearXNG (privacy-respecting metasearch engine) ─────────────────────────
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Playwright (headless browser / automation server) ──────────────────────
  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    restart: unless-stopped
    ports:
      - "3003:3003"
    command: ["npx", "playwright", "run-server", "--port", "3003", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/json"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Gitea (self-hosted Git service) ────────────────────────────────────────
  gitea:
    image: gitea/gitea:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2223:22"
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__ROOT_URL=http://localhost:3000
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__DOMAIN=localhost
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9002:9002"
    command: server /data --console-address ":9002"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-vibe}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MinIO Init (one-shot bucket provisioning) ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set vibe http://minio:9000 $${MINIO_ROOT_USER:-vibe} $${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env} &&
      mc mb --ignore-existing vibe/vibe-artifacts &&
      echo 'Bucket vibe-artifacts ready'
      "

  # ── Penpot Frontend ─────────────────────────────────────────────────────────
  penpot-frontend:
    image: penpotapp/frontend:latest
    restart: unless-stopped
    ports:
      - "9001:80"
    depends_on:
      - penpot-backend
      - penpot-exporter
    environment:
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-email-verification
    volumes:
      - penpot-assets:/opt/data/assets

  # ── Penpot Backend ──────────────────────────────────────────────────────────
  penpot-backend:
    image: penpotapp/backend:latest
    restart: unless-stopped
    depends_on:
      - penpot-postgres
      - penpot-redis
    environment:
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies
      - PENPOT_SECRET_KEY=${PENPOT_SECRET_KEY:?Set PENPOT_SECRET_KEY in .env}
      - PENPOT_DATABASE_URI=postgresql://penpot-postgres/penpot
      - PENPOT_DATABASE_USERNAME=penpot
      - PENPOT_DATABASE_PASSWORD=penpot
      - PENPOT_REDIS_URI=redis://penpot-redis/0
      - PENPOT_ASSETS_STORAGE_BACKEND=assets-fs
      - PENPOT_STORAGE_ASSETS_FS_DIRECTORY=/opt/data/assets
      - PENPOT_TELEMETRY_ENABLED=false
      - PENPOT_PUBLIC_URI=http://localhost:9001
    volumes:
      - penpot-assets:/opt/data/assets

  # ── Penpot Exporter ─────────────────────────────────────────────────────────
  penpot-exporter:
    image: penpotapp/exporter:latest
    restart: unless-stopped
    depends_on:
      - penpot-backend
    environment:
      - PENPOT_PUBLIC_URI=http://penpot-frontend
      - PENPOT_REDIS_URI=redis://penpot-redis/0
      - PENPOT_SECRET_KEY=${PENPOT_SECRET_KEY:?Set PENPOT_SECRET_KEY in .env}

  # ── Penpot Postgres ─────────────────────────────────────────────────────────
  penpot-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot
    volumes:
      - penpot-postgres:/var/lib/postgresql/data

  # ── Penpot Redis ────────────────────────────────────────────────────────────
  penpot-redis:
    image: redis:7-alpine
    restart: unless-stopped

  # ── Zep (agent memory for MiroFish simulations) ────────────────────────────
  zep-db:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zep
    volumes:
      - zep-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.22.0
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${ZEP_NEO4J_PASSWORD:-zep-neo4j-pass}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  graphiti:
    image: zepai/graphiti:0.3
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL_NAME=${MIROFISH_LLM_CLOUD_MODEL:-gpt-4o-mini}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${ZEP_NEO4J_PASSWORD:-zep-neo4j-pass}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  zep:
    image: zepai/zep:latest
    restart: unless-stopped
    depends_on:
      zep-db:
        condition: service_healthy
      graphiti:
        condition: service_healthy
    environment:
      - ZEP_STORE_TYPE=postgres
      - ZEP_STORE_POSTGRES_DSN=postgres://postgres:postgres@zep-db:5432/zep?sslmode=disable
      - ZEP_GRAPHITI_URL=http://graphiti:8003
    volumes:
      - ./zep.yaml:/app/zep.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MiroFish (multi-agent simulation engine) ──────────────────────────────
  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    restart: unless-stopped
    depends_on:
      zep:
        condition: service_healthy
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_API_KEY=${MIROFISH_LLM_API_KEY:-no-key-needed-for-local}
      - LLM_BASE_URL=${MIROFISH_LLM_API_URL:-http://host.docker.internal:8000/v1}
      - LLM_MODEL_NAME=${MIROFISH_LLM_MODEL:-${VLLM_MODEL:-QuantTrio/Qwen3.5-9B-AWQ}}
      - ZEP_API_KEY=${ZEP_API_KEY:-}
      - ZEP_API_URL=http://zep:8000
    volumes:
      - mirofish-uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── PaddleOCR (text extraction from images and PDFs) ──────────────────────
  paddleocr:
    build:
      context: ./deploy/paddleocr
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8868:8868"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8868/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── SSH Relay (local build) ─────────────────────────────────────────────────
  ssh-relay:
    build:
      context: ./ssh-relay
      dockerfile: Dockerfile
    restart: unless-stopped

  # ── Dev Runner (local build) ────────────────────────────────────────────────
  dev-runner:
    build:
      context: ./dev-runner
      dockerfile: Dockerfile
    restart: unless-stopped

volumes:
  gitea-data:
  minio-data:
  penpot-assets:
  penpot-postgres:
  zep-db-data:
  neo4j-data:
  mirofish-uploads:
